name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate Tag
        id: meta
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GIT_REF" != refs/tags/v* ]]; then
            printf 'ERROR: release must run on a tag matching v*, got ref: %s\n' "$GIT_REF" >&2
            exit 1
          fi

          if [[ ! "$GIT_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            printf 'ERROR: invalid semver tag: %s\n' "$GIT_REF_NAME" >&2
            exit 1
          fi

          printf 'version=%s\n' "$GIT_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and Archive
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          mkdir -p release_assets

          for arch in amd64 arm64; do
            printf 'Building for linux/%s...\n' "$arch"

            build_dir="build_linux_${arch}"
            mkdir -p "$build_dir"
            cp LICENSE README.md "$build_dir/"

            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -tags goolm \
              -ldflags "-s -w -X main.AppVersion=${APP_VERSION}" \
              -o "${build_dir}/migrator" \
              ./cmd/migrator

            tar -czf "release_assets/migrator-linux-${arch}.tar.gz" \
              -C "$build_dir" \
              LICENSE \
              README.md \
              migrator
          done

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release_assets/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release_assets

      - name: Publish Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release_assets/migrator-linux-amd64.tar.gz
            release_assets/migrator-linux-arm64.tar.gz
          fail_on_unmatched_files: true
